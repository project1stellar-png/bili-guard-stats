name: build-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller pillow
      - run: pyinstaller bgs-desktop.spec
      - run: Compress-Archive -Path dist/直播后台 -DestinationPath bili-guard-stats-windows.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: 直播后台-windows
          path: bili-guard-stats-windows.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: bili-guard-stats-windows.zip
