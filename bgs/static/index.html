<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>直播后台</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --fg:#1b1d23; --muted:#6b7280; --line:#e5e7eb; --accent:#ec5f8e; --accent-soft:#fdeaf1; --g1:#b45309; --g2:#7c3aed; --g3:#2563eb; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#111318; --card:#1a1d24; --fg:#e8eaf0; --muted:#9aa0ad; --line:#2a2e38; --accent-soft:#3a1f2a; } }
  * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system,"PingFang SC","Helvetica Neue",sans-serif; }
  :root[data-accent="blue"] { --accent:#3b82f6; --accent-soft:#e8f0fe } :root[data-accent="green"] { --accent:#22a06b; --accent-soft:#e6f6ee } :root[data-accent="slate"] { --accent:#475569; --accent-soft:#e9edf2 }
  body { display:flex; min-height:100vh }
  aside { width:200px; flex:none; background:var(--card); border-right:1px solid var(--line); padding:16px 12px; display:flex; flex-direction:column; gap:4px; position:sticky; top:0; height:100vh; box-sizing:border-box }
  aside h1 { font-size:15px; margin:4px 8px 14px; display:flex; align-items:center; gap:8px } aside h1 .logo { width:28px; height:28px; border-radius:8px; background:var(--accent); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:14px }
  aside .sec { font-size:11px; color:var(--muted); margin:10px 8px 2px }
  nav button { display:block; width:100%; text-align:left; background:none; border:none; border-radius:8px; padding:7px 10px; color:var(--fg); cursor:pointer; font-size:13px }
  nav button.on { background:var(--accent-soft); color:var(--accent); font-weight:600 }
  aside .foot { margin-top:auto; font-size:11px; color:var(--muted); padding:8px; line-height:1.7 }
  .swatches { display:flex; gap:6px; margin:4px 0 } .swatches span { width:16px; height:16px; border-radius:50%; cursor:pointer; border:2px solid transparent } .swatches span.on { border-color:var(--fg) }
  .content { flex:1; min-width:0 }
  header { display:flex; align-items:center; gap:8px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; z-index:5; flex-wrap:wrap }
  header h2 { margin:0; font-size:16px }
  header select { padding:4px 8px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--fg) }
  main { padding:16px; max-width:1200px }
  @media (max-width:720px) { body { display:block } aside { width:auto; height:auto; position:static; flex-direction:row; flex-wrap:wrap; border-right:none; border-bottom:1px solid var(--line) } aside h1, aside .sec, aside .foot { display:none } nav { display:flex; flex-wrap:wrap; gap:4px } nav button { width:auto } }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px }
  .card .k { color:var(--muted); font-size:12px } .card .v { font-size:22px; font-weight:600 }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden }
  th,td { padding:8px 10px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap } th { color:var(--muted); font-weight:500; font-size:12px }
  tr:last-child td { border-bottom:none } td.num, th.num { text-align:right }
  .tag { display:inline-block; padding:1px 7px; border-radius:999px; font-size:11px; color:#fff } .g1{background:var(--g1)} .g2{background:var(--g2)} .g3{background:var(--g3)}
  .link { color:var(--accent); cursor:pointer; text-decoration:underline dotted }
  .wrap { overflow-x:auto } .muted { color:var(--muted) } .empty { padding:24px; text-align:center; color:var(--muted) }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px } input,textarea { padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg) }
  .btn { background:var(--accent); color:#fff; border:none; border-radius:6px; padding:6px 12px; cursor:pointer } .btn.ghost { background:none; color:var(--muted); border:1px solid var(--line) }
  h2 { font-size:15px; margin:18px 0 8px } pre.thanks { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; white-space:pre-wrap }
  .bars { display:flex; gap:2px; align-items:flex-end; height:60px } .bars div { flex:1; background:var(--accent); border-radius:2px 2px 0 0; min-height:2px }
  dialog { border:none; border-radius:12px; background:var(--card); color:var(--fg); max-width:560px; width:92vw; max-height:85vh; overflow:auto; padding:18px }
  dialog::backdrop { background:rgba(0,0,0,.4) }
  .done td { text-decoration:line-through; color:var(--muted) }
</style>
</head>
<body>
<aside>
  <h1><span class="logo">播</span>直播后台</h1>
  <nav id="nav"></nav>
  <div class="foot">
    <div class="swatches" id="swatches"></div>
    <div id="footInfo"></div>
    <div><span class="link" onclick="if(confirm('退出后台程序？采集和录屏都会停止。')) api('/api/quit',{method:'POST'})">退出程序</span></div>
  </div>
</aside>
<div class="content">
<header>
  <h2 id="title"></h2>
  <label class="muted" style="margin-left:auto;font-size:12px;cursor:pointer"><input type="checkbox" id="net" onchange="NET=this.checked;localStorage.setItem('net',NET?'1':'0');render()"> 抽成后</label>
  <span id="dot" class="muted" style="font-size:12px"></span>
  <select id="session" style="margin-left:8px"></select>
</header>
<main id="main"></main>
</div>
<dialog id="dlg"></dialog>
<script>
const TABS = [["software","直播软件","开播"],["sessions","场次","直播数据"],["guards","舰长"],["flow","流水"],["gifts","礼物榜"],["attendance","打卡"],["churn","流失分析"],["thanks","感谢单","直播间管理"],["monthly","记账","个人安排"],["reconcile","对账"],["schedule","排播"],["settings","设置","系统"]];
const THEMES = {pink:"#ec5f8e", blue:"#3b82f6", green:"#22a06b", slate:"#475569"};
const $ = s => document.querySelector(s);
let RATE = 0.5, NET = localStorage.getItem("net") === "1";
const yuan = c => { const v = NET ? c*(1-RATE) : c; return (v/1000).toFixed(v%1000?1:0) + " 元"; };
const yuanRaw = c => (c/1000).toFixed(c%1000?1:0) + " 元";
const dt = t => new Date(t*1000).toLocaleString("zh-CN",{hour12:false});
const dts = t => new Date(t*1000).toLocaleDateString("zh-CN");
const tag = g => g ? `<span class="tag g${g}">${{1:"总督",2:"提督",3:"舰长"}[g]}</span>` : "";
const user = (uid,name) => `<span class="link" onclick="profile(${uid})">${esc(name||"?")}</span>`;
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = (p,o) => fetch(p,o).then(r=>r.json());
let tab = localStorage.getItem("tab") || "software", sessionId = "";

async function init(){
  const ss = await api("/api/sessions");
  $("#session").innerHTML = `<option value="">全部场次</option>` + ss.map(s=>`<option value="${s.id}">${dts(s.started_at)} ${new Date(s.started_at*1000).toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"})} · ${yuan(s.coin)} · ${s.danmu}弹幕</option>`).join("");
  $("#session").onchange = e => { sessionId = e.target.value; render(); };
  $("#nav").innerHTML = TABS.map(([k,n,sec])=>(sec?`<div class="sec">${sec}</div>`:"")+`<button data-k="${k}">${n}</button>`).join("");
  $("#swatches").innerHTML = Object.entries(THEMES).map(([k,c])=>`<span style="background:${c}" data-t="${k}" title="${k}"></span>`).join("");
  $("#swatches").onclick = e => { const t = e.target.dataset.t; if(!t) return; applyTheme(t); api("/api/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({theme:t})}); };
  $("#nav").onclick = e => { if(e.target.dataset.k){ tab=e.target.dataset.k; localStorage.setItem("tab",tab); render(); } };
  render();
  pollStatus();
}
async function pollStatus(){
  try {
    const st = await api("/api/status");
    const c = st.collect || {};
    RATE = st.commission_rate ?? 0.5; $("#net").checked = NET;
    if(st.theme && document.documentElement.dataset.accent !== st.theme) applyTheme(st.theme);
    $("#footInfo").innerHTML = `${st.collecting ? "● 采集中" : "○ 未采集"}<br>房间 ${st.room_id||"-"} · ${st.logged_in ? "已登录" : "未登录"}`;
    $("#dot").textContent = st.collecting ? (c.connected ? `● 采集中 · ${c.events||0} 条` : `◐ 连接中 ${c.error?("· "+c.error.slice(0,40)):""}`) : "○ 未采集";
    $("#dot").style.color = st.collecting && c.connected ? "#16a34a" : "";
  } catch(e) {}
  setTimeout(pollStatus, 3000);
}
async function settings(){
  const st = await api("/api/status");
  const c = st.collect || {};
  return `<div class="cards">
    <div class="card"><div class="k">登录</div><div class="v">${st.logged_in ? "已登录" : "未登录"}</div><div class="muted">${st.logged_in ? "uid "+st.uid : "不登录也能连，但弹幕里的 uid 会被打码"}</div></div>
    <div class="card"><div class="k">采集</div><div class="v">${st.collecting ? (c.connected ? "运行中" : "连接中") : "停止"}</div><div class="muted">${c.error ? esc(c.error).slice(0,80) : (c.real_room ? "房间 "+c.real_room+" · 直播状态 "+({0:"未开播",1:"直播中",2:"轮播"}[c.live_status]??c.live_status) : "")}</div></div>
    <div class="card"><div class="k">数据位置</div><div class="v" style="font-size:13px;word-break:break-all">${esc(st.db_path)}</div></div>
  </div>
  <h2>房间</h2>
  <div class="row"><input id="room" type="number" placeholder="直播间号（短号也行）" value="${st.room_id||""}" style="width:220px"><button class="btn" onclick="saveRoom()">保存</button>
    ${st.collecting ? `<button class="btn ghost" onclick="api('/api/collect/stop',{method:'POST'}).then(render)">停止采集</button>` : `<button class="btn" onclick="api('/api/collect/start',{method:'POST'}).then(r=>{ if(r.error) alert(r.error); render(); })">开始采集</button>`}
  </div>
  <p class="muted">开播前点「开始采集」，它会先拉一次舰长名单，然后持续记弹幕 / 礼物 / 上舰 / SC / 进场，断线自动重连。关掉这个程序就停止。</p>
  <h2>抽成口径</h2>
  <div class="row"><input id="rate" type="number" min="0" max="100" step="1" value="${Math.round((st.commission_rate??0.5)*100)}" style="width:90px"> <span class="muted" style="align-self:center">% 平台计提（官方口径 PC / 安卓端 50%，税前）。勾上顶栏「抽成后」时，所有金额按 1 − 比例 换算。</span><button class="btn ghost" onclick="saveRate()">保存</button></div>
  <h2>录屏</h2>
  <div class="row"><input id="recDir" placeholder="录屏保存目录（留空 = 程序旁 data/录屏）" value="${esc(st.record_dir||"")}" style="flex:1;min-width:240px"><input id="audioDev" placeholder="音频输入设备名" value="${esc(st.audio_device||"")}" style="min-width:200px"><button class="btn ghost" onclick="pickDevice()">列出设备</button></div>
  <div class="row"><input id="ffPath" placeholder="ffmpeg 路径（留空自动找）" value="${esc(st.ffmpeg_path||"")}" style="flex:1;min-width:240px"><input id="hotkey" placeholder="快捷键" value="${esc(st.hotkey||"ctrl+alt+f9")}" style="width:140px"><button class="btn ghost" onclick="saveRec()">保存</button></div>
  <p class="muted">快捷键只在 Windows 生效，改了要重启程序。</p>
  <h2>AI 总结（可选）</h2>
  <div class="row"><input id="aiKey" type="password" placeholder="Anthropic API Key，留空则用规则模板生成近况" value="${st.ai_configured?"（已填写，重新输入可替换）":""}" style="flex:1;min-width:280px" onfocus="if(this.value.startsWith('（'))this.value=''"><button class="btn ghost" onclick="saveAiKey()">保存</button></div>
  <p class="muted">填了之后画像弹窗里多一个「用 AI 重写近况」按钮，发给模型的只有统计数据和公开资料，不含弹幕原文。按次计费，用你自己的 Key。</p>
  <h2>B站登录</h2>
  <div class="row"><button class="btn" onclick="startLogin()">${st.logged_in ? "重新扫码" : "扫码登录"}</button>${st.logged_in ? `<button class="btn ghost" onclick="api('/api/logout',{method:'POST'}).then(render)">退出登录</button>` : ""}</div>
  <div id="qrbox"></div>
  <p class="muted">用的是 B站网页端的扫码登录，登录态只保存在本机的 config.toml 里，不要把它发给别人。</p>`;
}
async function saveRoom(){
  await api("/api/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({room_id:$("#room").value})});
  render();
}
async function software(){
  const [pg, rc] = await Promise.all([api("/api/programs"), api("/api/record")]);
  const items = pg.items, checked = items.filter(x=>x.checked).length;
  const fmt = t => new Date(t*1000).toLocaleString("zh-CN",{hour12:false});
  const recBtn = rc.recording ? `<button class="btn" style="background:#dc2626" onclick="api('/api/record/stop',{method:'POST'}).then(render)">■ 停止录制 ${Math.floor(rc.elapsed/60)}:${String(rc.elapsed%60).padStart(2,"0")}</button>`
                              : `<button class="btn" onclick="api('/api/record/start',{method:'POST'}).then(r=>{ if(r.error) alert(r.error); render(); })" ${rc.ffmpeg?"":"disabled title='没找到 ffmpeg'"}>● 开始录制</button>`;
  const groups = pg.groups.map(g => {
    const rows = items.filter(x=>x.grp===g);
    if(!rows.length) return "";
    return `<div class="card" style="padding:0;margin-bottom:12px"><div style="display:flex;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)"><b>${g}</b><span class="muted" style="margin-left:8px">${rows.filter(x=>x.checked).length}/${rows.length} 已选</span><span style="margin-left:auto"><button class="btn ghost" onclick="setGroup('${g}',1)">全选</button> <button class="btn ghost" onclick="setGroup('${g}',0)">清空</button></span></div>
    ${rows.map(x=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)">
      <input type="checkbox" ${x.checked?"checked":""} onchange="api('/api/programs/${x.id}',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({checked:this.checked?1:0})})">
      <div style="flex:1;min-width:0"><b>${esc(x.name)}</b> ${x.running?'<span class="tag" style="background:#16a34a">运行中</span>':'<span class="tag" style="background:#9ca3af">未启动</span>'} ${x.exists?"":'<span class="tag" style="background:#dc2626">文件不存在</span>'}<div class="muted" style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.path)} ${x.args?esc(x.args):""}</div></div>
      <button class="btn ghost" onclick="api('/api/programs/${x.id}/launch',{method:'POST'}).then(r=>{ if(r.error) alert(r.error); setTimeout(render,1500); })">启动</button>
      <button class="btn ghost" onclick="api('/api/programs/${x.id}/folder',{method:'POST'})">文件夹</button>
      <button class="btn ghost" onclick="if(confirm('删除 ${esc(x.name)}？')) api('/api/programs/${x.id}',{method:'DELETE'}).then(render)">删除</button></div>`).join("")}</div>`;
  }).join("");
  return `<div class="card" style="margin-bottom:12px"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><b>屏幕录制</b><span class="muted">存到 ${esc(rc.record_dir)} · 声音：${esc(rc.audio_device||"无")} · 快捷键 Ctrl+Alt+F9（Windows）</span><span style="margin-left:auto">${recBtn} <button class="btn ghost" onclick="api('/api/record/folder',{method:'POST'})">打开文件夹</button></span></div>
    ${rc.error?`<div style="color:#dc2626;font-size:12px;margin-top:6px">${esc(rc.error)}</div>`:""}
    ${rc.recent.length?`<div class="muted" style="font-size:12px;margin-top:6px">最近：${rc.recent.slice(0,4).map(f=>`${esc(f.name)}（${f.size_mb} MB）`).join(" · ")}</div>`:""}
    ${rc.ffmpeg?"":'<div class="muted" style="font-size:12px;margin-top:6px">没找到 ffmpeg：Windows 包自带；手动运行时把 ffmpeg 放到 PATH 或在设置里填路径。</div>'}</div>
  <div class="row" style="align-items:center"><button class="btn" onclick="launchAll()">🚀 一键启动（${checked} 个）</button><button class="btn ghost" onclick="setAll(1)">全选</button><button class="btn ghost" onclick="setAll(0)">全不选</button>
    <label class="muted" style="font-size:12px"><input type="checkbox" id="skipRun" ${localStorage.getItem("skipRun")!=="0"?"checked":""} onchange="localStorage.setItem('skipRun',this.checked?'1':'0')"> 已在运行的跳过</label>
    <button class="btn ghost" onclick="render()">刷新状态</button><span id="launchMsg" class="muted" style="font-size:12px"></span>
    <span style="margin-left:auto"><button class="btn ghost" onclick="addProgramDlg()">＋ 添加程序</button></span></div>
  ${groups || '<div class="empty">还没有登记程序，点右上角「添加程序」，把 OBS、直播姬、VTube Studio 这些的 exe 路径填进来。</div>'}`;
}
async function setAll(v){ const pg = await api("/api/programs"); await Promise.all(pg.items.map(x=>api(`/api/programs/${x.id}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({checked:v})}))); render(); }
async function setGroup(g,v){ const pg = await api("/api/programs"); await Promise.all(pg.items.filter(x=>x.grp===g).map(x=>api(`/api/programs/${x.id}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({checked:v})}))); render(); }
async function launchAll(){
  $("#launchMsg").textContent = "启动中…";
  const r = await api("/api/programs/launch",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({skip_running:$("#skipRun").checked})});
  const bad = r.results.filter(x=>!x.ok), skipped = r.results.filter(x=>x.skipped).length;
  $("#launchMsg").textContent = `已启动 ${r.results.length-bad.length-skipped} 个，跳过 ${skipped} 个` + (bad.length?`，失败：${bad.map(x=>x.name+"("+x.error+")").join("、")}`:"");
  setTimeout(render, 2000);
}
function addProgramDlg(){
  const dlg = $("#dlg");
  dlg.innerHTML = `<h2 style="margin-top:0">添加程序</h2>
    <div class="row"><input id="pName" placeholder="名字，如 OBS Studio" style="flex:1"></div>
    <div class="row"><input id="pPath" placeholder="exe 完整路径，如 D:\\steam\\...\\obs64.exe（可从资源管理器复制路径粘过来）" style="flex:1"></div>
    <div class="row"><select id="pGrp">${["直播推流","虚拟形象","音频声卡","唱歌音乐","其他"].map(g=>`<option>${g}</option>`).join("")}</select><input id="pArgs" placeholder="启动参数（可选）" style="flex:1"></div>
    <p><button class="btn" onclick="addProgram()">添加</button> <button class="btn ghost" onclick="dlg.close()">取消</button></p>`;
  dlg.showModal();
}
async function addProgram(){
  const path = $("#pPath").value.trim(); if(!path) return;
  await api("/api/programs",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:$("#pName").value, path, grp:$("#pGrp").value, args:$("#pArgs").value})});
  $("#dlg").close(); render();
}
async function churn(){
  const d = await api("/api/churn");
  const sn = d.snap || {};
  const snapBtn = sn.running ? `<span class="muted">拉取中 ${sn.done}/${sn.total}${sn.errors?`，失败 ${sn.errors}`:""}</span>`
    : `<button class="btn" onclick="api('/api/churn/snapshot',{method:'POST'}).then(r=>{ if(r.error) alert(r.error); setTimeout(render,1500); })">${d.last_snapshot?"重新拉取勋章墙":"拉取勋章墙"}</button>`;
  if(sn.running) setTimeout(()=>{ if(tab==="churn") render(); }, 4000);
  const head = `<p class="muted">常客 = 之前 ${d.prior.length} 场里出勤 ≥ 2 场的人；流失 = 常客里最近 ${d.recent.length} 场一次都没出现的人。「主场」取他当前佩戴的粉丝牌，没戴就取等级最高的别家牌子，数据来自 B站公开的勋章墙，每周自动拍一次快照。对方把勋章墙设为不公开时，退而用他最近一次进你直播间时佩戴的牌子（标「进场佩戴」，只能看到牌子名）。</p>
    <div class="row" style="align-items:center">${snapBtn}<span class="muted" style="font-size:12px">${d.last_snapshot?"上次快照 "+dt(d.last_snapshot)+"，覆盖 "+d.snapshot_users+" 人":"还没有快照"}${sn.error?` · 最近错误：${esc(sn.error)}`:""}</span></div>`;
  if(!d.enough) return head + `<div class="empty">至少要 ${4} 场直播的数据才能算流失，现在 ${d.recent.length+d.prior.length} 场</div>`;
  const g = x => x ? `<span class="tag g${x}">${{1:"总督",2:"提督",3:"舰长"}[x]}</span>` : "";
  const homeCell = u => !u.home ? (u.snapshot ? '<span class="muted">没有别家牌子</span>' : '<span class="muted">未拉取 / 勋章墙不公开</span>')
    : `${esc(u.home.target_name)} <span class="muted">${esc(u.home.medal_name)} Lv${u.home.level}${u.home.wearing?" · 佩戴中":""}${u.home.guard_level?" · "+{1:"总督",2:"提督",3:"舰长"}[u.home.guard_level]:""}${u.home.level_gain>0?` · 本周 +${u.home.level_gain}`:""}</span>`;
  return head + `<div class="cards">${[["常客",d.regulars],["流失",d.churned.length],["流失率",d.regulars?Math.round(d.churned.length/d.regulars*100)+"%":"-"]].map(([k,v])=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("")}</div>
  ${d.flow.length?`<h2>流向排行</h2>${table(["主播","#人数"], d.flow.map(f=>`<tr>${td(esc(f.target_name))}${td(f.n,1)}</tr>`))}`:""}
  <h2>流失名单</h2>
  ${table(["用户","#之前出勤","#弹幕","#消费","#你家牌子","现在的主场","上升最快"], d.churned.map(u=>`<tr>${td(g(u.guard_level)+" "+user(u.uid,u.uname))}${td(u.prior_attend+"/"+d.prior.length,1)}${td(u.danmu,1)}${td(yuan(u.coin),1)}${td(u.own_level!=null?"Lv"+u.own_level:"-",1)}${td(homeCell(u))}${td(u.rising?esc(u.rising):"")}</tr>`), "最近几场常客都在，没有流失")}`;
}
async function aiSummary(uid){
  const el = $("#aiText"); el.textContent = "生成中…";
  const r = await api(`/api/user/${uid}/ai`,{method:"POST"});
  el.textContent = r.error || r.text;
}
async function saveAiKey(){
  const v = $("#aiKey").value; if(v.startsWith("（")) return;
  await api("/api/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({anthropic_api_key:v})});
  render();
}
async function saveRec(){
  await api("/api/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({record_dir:$("#recDir").value, audio_device:$("#audioDev").value, ffmpeg_path:$("#ffPath").value, hotkey:$("#hotkey").value})});
  render();
}
async function pickDevice(){
  const r = await api("/api/record/devices");
  if(r.error){ alert(r.error); return; }
  if(!r.devices.length){ alert("没有找到音频输入设备"); return; }
  const v = prompt("可用设备：\n" + r.devices.map((d,i)=>`${i+1}. ${d}`).join("\n") + "\n\n输入编号：", "1");
  const d = r.devices[(+v)-1]; if(d){ $("#audioDev").value = d; }
}
async function saveRate(){
  await api("/api/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({commission_rate:(+$("#rate").value)/100})});
  render();
}
async function reconcile(){
  const days = await api("/api/official/days");
  const day = localStorage.getItem("recDay") || new Date().toISOString().slice(0,10);
  const r = await api("/api/reconcile?day="+day);
  const sign = v => v>0 ? "+"+yuanRaw(v) : v<0 ? "−"+yuanRaw(-v) : "一致";
  return `<p class="muted">官方流水来自主播后台（需主播本人登录），本地流水来自弹幕采集。差值 = 本地 − 官方；正数多记，负数漏记。金额均为面值，不受「抽成后」开关影响。</p>
  <div class="row"><input type="date" id="recDay" value="${day}" onchange="localStorage.setItem('recDay',this.value);render()"><button class="btn" onclick="fetchOfficial()">拉取这天的官方流水</button><span id="recMsg" class="muted" style="align-self:center"></span></div>
  <div class="cards">${[["官方合计", r.official_fetched ? yuanRaw(r.official_total) : "未拉取"],["本地合计", yuanRaw(r.local_total)],["差值", r.official_fetched ? sign(r.local_total - r.official_total) : "-"]].map(([k,v])=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("")}</div>
  ${table(["用户","#官方","#本地","#差值","#官方笔数","#本地笔数"], r.rows.map(x=>`<tr style="${x.diff?'color:var(--accent)':''}">${td(user(x.uid,x.uname))}${td(yuanRaw(x.official),1)}${td(yuanRaw(x.local),1)}${td(sign(x.diff),1)}${td(x.official_n,1)}${td(x.local_n,1)}</tr>`), "这天两边都没有付费记录")}
  ${days.length ? `<h2>已拉取的官方流水</h2>${table(["日期","#笔数","#合计"], days.map(d=>`<tr>${td(`<span class="link" onclick="localStorage.setItem('recDay','${d.day}');render()">${d.day}</span>`)}${td(d.n,1)}${td(yuanRaw(d.coin||0),1)}</tr>`))}` : ""}`;
}
async function fetchOfficial(){
  const day = $("#recDay").value; $("#recMsg").textContent = "拉取中…";
  const r = await api("/api/reconcile/fetch",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({day})});
  if(r.error){ $("#recMsg").textContent = r.error; return; }
  render();
}
let loginTimer = null;
async function startLogin(){
  clearTimeout(loginTimer);
  const r = await api("/api/login/qr",{method:"POST"});
  $("#qrbox").innerHTML = `<div class="card" style="display:inline-block;text-align:center"><img src="${r.png}" width="220" height="220" style="display:block;image-rendering:pixelated"><div id="qrmsg" class="muted">用 B站 App 扫码，3 分钟内有效</div></div>`;
  const tick = async () => {
    const p = await api("/api/login/poll");
    const m = $("#qrmsg"); if(!m) return;
    if(p.code === 0){ m.textContent = "登录成功"; setTimeout(render, 800); return; }
    if(p.code === 86038){ m.textContent = "二维码已过期，点按钮重新生成"; return; }
    if(p.code === 86090) m.textContent = "已扫码，请在手机上确认";
    loginTimer = setTimeout(tick, 2000);
  };
  loginTimer = setTimeout(tick, 2000);
}
function applyTheme(t){ document.documentElement.dataset.accent = t; document.querySelectorAll("#swatches span").forEach(x=>x.classList.toggle("on",x.dataset.t===t)); }
let renderSeq = 0;
async function render(){
  const seq = ++renderSeq;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.k===tab));
  $("#title").textContent = (TABS.find(t=>t[0]===tab)||[])[1] || "";
  $("#main").innerHTML = `<div class="empty">加载中…</div>`;
  const html = await ({software,settings,sessions,guards,flow,gifts,attendance,churn,thanks,monthly,reconcile,schedule})[tab]();
  if (seq === renderSeq) $("#main").innerHTML = html;
}
const table = (heads, rows, empty="暂无数据") => rows.length ? `<div class="wrap"><table><tr>${heads.map(h=>`<th class="${h.startsWith("#")?"num":""}">${h.replace(/^#/,"")}</th>`).join("")}</tr>${rows.join("")}</table></div>` : `<div class="empty">${empty}</div>`;
const td = (v,num) => `<td class="${num?"num":""}">${v}</td>`;

async function sessions(){
  const ss = await api("/api/sessions");
  const dur = s => s.ended_at ? ((s.ended_at-s.started_at)/3600).toFixed(1)+" h" : "进行中";
  return `<p class="muted">观看人数 / 高能榜在线 / 点赞来自直播间广播（WATCHED_CHANGE、ONLINE_RANK_COUNT、LIKE_INFO_V3_UPDATE），峰值取场内最大值。</p>` +
    table(["开始","#时长","#弹幕","#互动人数","#在线峰值","#看过","#点赞","#收入"], ss.map(s=>`<tr>${td(dt(s.started_at))}${td(dur(s),1)}${td(s.danmu,1)}${td(s.users,1)}${td(s.peak_online??"-",1)}${td(s.watched??"-",1)}${td(s.likes??"-",1)}${td(yuan(s.coin),1)}</tr>`), "还没有场次");
}
async function guards(){
  const g = await api("/api/guards");
  const n = {1:0,2:0,3:0}; g.forEach(x=>n[x.guard_level]++);
  return `<div class="cards">${[["大航海总数",g.length],["总督",n[1]],["提督",n[2]],["舰长",n[3]],["本工具期间有互动",g.filter(x=>x.attend).length]].map(([k,v])=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("")}</div>
  ${table(["等级","用户","#粉丝牌","#陪伴天数","#出勤","#在场(h)","#弹幕","#消费"], g.map(x=>`<tr>${td(tag(x.guard_level))}${td(user(x.uid,x.uname))}${td(x.medal_level??"-",1)}${td(x.accompany_days??"-",1)}${td(x.attend+"/"+x.total_sessions,1)}${td(x.presence_h,1)}${td(x.danmu,1)}${td(yuan(x.coin),1)}</tr>`), "还没有舰长快照，先跑 bgs.collect")}`;
}
async function flow(){
  const f = await api("/api/flow?session="+sessionId);
  return table(["时间","类型","用户","内容","#金额"], f.map(x=>`<tr>${td(dt(x.ts))}${td({SEND_GIFT:"礼物",GUARD_BUY:"上舰",SUPER_CHAT_MESSAGE:"SC"}[x.cmd])}${td(tag(x.guard_level)+" "+user(x.uid,x.uname))}${td(esc(x.text))}${td(yuan(x.coin),1)}</tr>`), "本范围内没有付费流水");
}
async function gifts(){
  const g = await api("/api/gifts?session="+sessionId);
  return table(["#","用户","#总消费","#SC","#上舰次数","#事件数"], g.map((x,i)=>`<tr>${td(i+1)}${td(tag(x.guard_level)+" "+user(x.uid,x.uname))}${td(yuan(x.coin),1)}${td(x.sc,1)}${td(x.guard_buy,1)}${td(x.n,1)}</tr>`), "本范围内没有付费记录");
}
async function attendance(){
  const a = await api("/api/attendance");
  return `<p class="muted">出勤 = 该场有过弹幕 / 礼物 / 点赞等互动；在场时长按互动间隔估算。</p>` + table(["用户","#出勤","#在场(h)","#弹幕","首次出现","最近出现"], a.map(x=>`<tr>${td(tag(x.guard_level)+" "+user(x.uid,x.uname))}${td(x.attend+"/"+x.total_sessions,1)}${td(x.presence_h,1)}${td(x.danmu,1)}${td(dts(x.first_seen))}${td(dt(x.last_seen))}</tr>`));
}
async function thanks(){
  const t = await api("/api/thanks?session="+sessionId);
  const lines = [];
  if(t.guard.length) lines.push("【上舰】"+t.guard.map(x=>`${x.uname}（${x.text||{1:"总督",2:"提督",3:"舰长"}[x.guard_level]}）`).join("、"));
  if(t.sc.length) lines.push("【SC】"+t.sc.map(x=>`${x.uname} ${yuan(x.coin)}`).join("、"));
  if(t.gift.length) lines.push("【礼物】"+t.gift.map(x=>`${x.uname} ${yuan(x.coin)}`).join("、"));
  const text = lines.length ? "感谢今天的支持！\n"+lines.join("\n") : "这场没有付费记录";
  return `<div class="row"><button class="btn" onclick="navigator.clipboard.writeText(document.querySelector('pre.thanks').innerText)">复制感谢单</button><span class="muted">${sessionId?"当前所选场次":"默认最近一场"}</span></div><pre class="thanks">${esc(text)}</pre>`;
}
async function monthly(){
  const m = await api("/api/monthly");
  return m.length ? m.map(x=>`<h2>${x.month} <span class="muted">· ${x.sessions} 场 · ${x.payers} 人付费</span></h2>
    <div class="cards">${[["总收入",yuan(x.total)],["礼物",yuan(x.gift)],["SC",yuan(x.sc)],["大航海",yuan(x.guard)]].map(([k,v])=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("")}</div>
    ${table(["#","用户","#消费"], x.top.map((u,i)=>`<tr>${td(i+1)}${td(user(u.uid,u.uname))}${td(yuan(u.coin),1)}</tr>`))}`).join("") : `<div class="empty">暂无数据</div>`;
}
async function schedule(){
  const s = await api("/api/schedule");
  const today = new Date().toISOString().slice(0,10);
  return `<div class="row"><input type="date" id="sd" value="${today}"><input type="time" id="st" value="20:00"><input id="sti" placeholder="标题，如：周五杂谈" style="flex:1;min-width:160px"><input id="sn" placeholder="备注"><button class="btn" onclick="addSched()">添加</button></div>
  ${table(["日期","时间","标题","备注",""], s.map(x=>`<tr class="${x.done?"done":""}">${td(x.date)}${td(x.start||"")}${td(esc(x.title))}${td(esc(x.note||""))}<td><button class="btn ghost" onclick="api('/api/schedule/${x.id}/toggle',{method:'POST'}).then(render)">${x.done?"撤销":"完成"}</button> <button class="btn ghost" onclick="api('/api/schedule/${x.id}',{method:'DELETE'}).then(render)">删除</button></td></tr>`), "还没有排播安排")}`;
}
async function addSched(){
  const title = $("#sti").value.trim(); if(!title) return;
  await api("/api/schedule",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({date:$("#sd").value,start:$("#st").value,title,note:$("#sn").value})});
  render();
}
async function profile(uid){
  const p = await api("/api/user/"+uid);
  const dlg = $("#dlg");
  if(p.error){ dlg.innerHTML = `<p>uid ${uid} 在本工具运行期间没有互动记录。</p><button class="btn" onclick="dlg.close()">关闭</button>`; return dlg.showModal(); }
  const hrs = Array.from({length:24},(_,h)=>p.active_hours[h]||0), mx = Math.max(1,...hrs);
  const c = p.card, m = p.medals || {};
  const cardLine = c ? `<div class="muted" style="font-size:12px;margin-bottom:8px">B站 Lv${c.level} · 粉丝 ${c.fans} · 关注 ${c.attention}${c.vip?" · 大会员":""}${c.official?" · "+esc(c.official):""}${c.sign?"<br>签名："+esc(c.sign):""}</div>` : "";
  const homeLine = m.home ? `主场：${esc(m.home.target_name)} ${esc(m.home.medal_name)} Lv${m.home.level}${m.home.wearing?"（佩戴中）":""}${m.home.guard_level?" · 那边"+{1:"总督",2:"提督",3:"舰长"}[m.home.guard_level]:""}` : (p.trajectory_brief?.last_worn ? `最近来时戴：${esc(p.trajectory_brief.last_worn.medal_name)}` : (m.snapshot ? "没有别家牌子" : "勋章墙未拉取或不公开"));
  dlg.innerHTML = `<h2 style="margin-top:0">${tag(p.guard_level)} ${esc(p.uname)} <span class="muted">uid ${p.uid}</span></h2>
    ${cardLine}
    <div class="card" style="margin-bottom:10px"><div class="k">用户近况</div><div id="aiText">${esc(p.recent_status||p.description)}</div>
      <div class="muted" style="font-size:12px;margin-top:6px">${homeLine}${p.trajectory_brief?.top_words?.length?" · 常说："+p.trajectory_brief.top_words.map(esc).join(" / "):""}</div>
      ${p.ai_available?`<div style="margin-top:8px"><button class="btn ghost" onclick="aiSummary(${p.uid})">用 AI 重写近况</button></div>`:""}</div>
    <div class="cards">${[["消费",yuan(p.coin)],["出勤",p.attend+"/"+p.total_sessions],["在场(h)",p.presence_h],["弹幕",p.danmu],["粉丝牌",p.medal_level||"-"]].map(([k,v])=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("")}</div>
    <div class="k muted">活跃时段（0–23 点）</div><div class="bars">${hrs.map((v,h)=>`<div title="${h}点 ${v}次" style="height:${v/mx*100}%"></div>`).join("")}</div>
    ${p.guard_since?`<p class="muted">首次出现在舰长名单：${dts(p.guard_since)}</p>`:""}
    <h2>最近记录</h2>${table(["时间","类型","内容","#金额"], p.recent.map(x=>`<tr>${td(dt(x.ts))}${td(x.cmd)}${td(esc(x.text))}${td(x.coin?yuan(x.coin):"",1)}</tr>`))}
    <p><button class="btn" onclick="dlg.close()">关闭</button></p>`;
  dlg.showModal();
}
init();
</script>
</body>
</html>
